spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate
    show-sql: false
application:
  security:
    refresh-token:
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS}
      cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE}
      cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE}
      cookie-path: ${REFRESH_TOKEN_COOKIE_PATH}
      cookie-domain: ${REFRESH_TOKEN_COOKIE_DOMAIN}
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allowed-methods: ${CORS_ALLOWED_METHODS}
      allowed-headers: ${CORS_ALLOWED_HEADERS}