name: auth-service-infra

services:
  postgres:
    image: mysql:8
    restart: unless-stopped
    container_name: auth_db_mysql
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: admin123
    ports:
      - "3307:3306"
    volumes:
      - ./volumes/db/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -padmin123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth-service-network

networks:
  auth-service-network:
    driver: bridge